# Gazetteer of public persons and brands commonly impersonated in Polish scam ads.
# Owner: W2 (text module). Names only - no photos, no page content.
#
# Matching rules (fakecollector/features/text.py):
#   - aliases are matched case-insensitively on diacritic-folded text;
#   - each alias token is stemmed (Polish inflection: "Rafała Brzoskę" -> "Rafał Brzoska");
#   - `exact: true` aliases are matched case-sensitively as whole words, without stemming
#     (use for short acronyms like ING, ZUS, WP that would otherwise collide with words).
#   - `generic: true` brands are reported in `brands` but excluded from `entities`
#     (they appear on almost every page: comment widgets, footers, payment-method lists
#     with bank logos) to avoid noise links.
#   - add irregular inflected forms (e.g. "Brzosce", "Dudzie") as extra aliases.
#
# Types: person | media | bank | brand | gov | platform

